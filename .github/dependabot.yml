# AD-022: weekly grouped updates whose commit messages pass the shared Git
# policy. A seven-day cooldown lets a compromised release be yanked first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Rome
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Rome
    groups:
      frontend:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Rome
    groups:
      containers:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
