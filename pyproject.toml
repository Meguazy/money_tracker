[project]
name = "money-tracker"
version = "0.1.0"
description = "A LangGraph-based personal finance assistant with local LLM inference."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langfuse>=4.7,<5.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "pillow>=12.3,<13.0",
    "psycopg[binary,pool]>=3.3,<4.0",
    "pydantic>=2.13,<3.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn>=0.35,<1.0",
]

[project.scripts]
money-tracker = "money_tracker.cli:main"
money-tracker-admin = "money_tracker.administration:main"
money-tracker-backup = "money_tracker.backup_cli:main"
money-tracker-db = "money_tracker.persistence.cli:main"
money-tracker-eval = "money_tracker.evaluations.cli:main"
money-tracker-telegram = "money_tracker.telegram.cli:main"
money-tracker-api = "money_tracker.web.cli:main"
money-tracker-validate-docs = "money_tracker.development.docs_validation:main"
money-tracker-worker = "money_tracker.worker.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.14,<1.0",
    "types-pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/money_tracker"]

[tool.pytest.ini_options]
# Long tracebacks print every argument of a failing test, and real-service
# fixtures hold credential-bearing database URLs and API key pairs. The short
# style names the failing lines and assertion values without those arguments.
addopts = "--strict-config --strict-markers --tb=short"
testpaths = ["tests"]
markers = [
    "postgres: requires the real application PostgreSQL service",
    "inference: requires a real OpenAI-compatible local inference service",
    "telegram: requires the real Telegram test bot over the official Bot API",
    "langfuse: requires the real local Langfuse instance and may enable tracing",
]

[tool.coverage.run]
branch = true
source = ["money_tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
