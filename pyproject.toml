[project]
name = "money-tracker"
version = "0.1.0"
description = "A LangGraph-based personal finance assistant with local LLM inference."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langfuse>=4.0,<5.0",
    "langgraph>=1.0,<2.0",
]

[project.scripts]
money-tracker = "money_tracker.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/money_tracker"]
