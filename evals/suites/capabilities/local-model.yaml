suite_schema_version: "1"
suite: capabilities/local-model
version: "1.2.0"
dataset: ../../datasets/capabilities-local-model-v1.2.jsonl
runner: money-tracker-eval capabilities
private_data: false
required_probes:
  - server_metadata
  - strict_structured_output
  - tool_calling
  - tool_result_sequencing
  - optional_field_omission
  - union_output
conditional_probes:
  - name: image_input
    condition: image fixture supplied and model is evaluated for vision
blocking_rules:
  - every required probe passes
  - exact GGUF SHA-256 and quantization are recorded
  - exact llama.cpp binary SHA-256 and version are recorded
  - exact chat-template SHA-256 is recorded
  - configured context size is recorded
probe_gates:
  optional_field_omission:
    added_in: "1.2.0"
    question: >
      Does the candidate leave an optional field alone when the message states
      nothing for it, while still capturing the ones the message does state?
    shapes:
      - required_nullable
      - optional_absent
    pre_registered_thresholds:
      silent_slots_left_empty: 0.95
      stated_slots_captured: 0.95
      schema_invalid_responses: 0
    rule: >
      Passes when at least one shape reaches both thresholds with no invalid
      answer. Either shape is admissible because a boundary may adopt the one
      that works; which shape passed is the actionable half of the result.
  union_output:
    added_in: "1.2.0"
    question: >
      Can the candidate answer with a discriminated union, so that filling a
      field belonging to the branch it did not choose is unexpressible?
    shapes:
      - root_union
      - nested_union
    pre_registered_thresholds:
      schema_accepted: true
      schema_invalid_responses: 0
      answers_carrying_a_foreign_field: 0
      both_variants_reachable: true
    rule: >
      Passes when at least one shape satisfies every mechanical expectation.
      Variant-selection accuracy is recorded as a diagnostic only, because
      categorization/purpose-it owns that gate and two documents must not gate
      the same behaviour.
reading_the_report: >
  blocking_gates_passed is true only when every screened capability passed. A
  per-probe result is the answer to whether one boundary shape may be used, so
  a false aggregate does not by itself reject a candidate for every interface.

  A probe reports `error` only when it could not run: an unreachable server, a
  malformed response, a rejected schema. A candidate that answers and answers
  wrongly reports `failed`, with the numbers behind the verdict. A case the
  candidate never answered, having spent its token budget without emitting one,
  counts as an invalid response and is also reported on its own as
  `answers_not_produced`, because a refusal and a malformed answer have
  different causes. No threshold changed with that counting: an unanswered case
  was previously fatal to its whole probe, so a screen that reported a measured
  failure now reported an unmeasured one instead.
publication:
  local_artifacts: required
  langfuse: optional
  content: aggregate scores and artifact hashes only
promotion_effect: none
